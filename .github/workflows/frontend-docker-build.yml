name: Build Frontend Docker Images

on:
  workflow_dispatch:
    inputs:
      app:
        description: Frontend app to build Docker image for
        required: true
        default: all
        type: choice
        options:
          - all
          - but
          - haobao
          - xybaoyuan

permissions:
  contents: write

env:
  ALIYUN_REGISTRY: crpi-8o01gg1zrswkepyk.cn-shenzhen.personal.cr.aliyuncs.com
  FRONTEND_DOCKER_APPS: 'but haobao xybaoyuan'

concurrency:
  group: frontend-docker-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  frontend-docker-build:
    name: Build frontend Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Resolve selected frontend apps
        id: frontend_apps
        shell: bash
        run: |
          selected="${{ inputs.app }}"
          read -r -a all_apps <<< "${FRONTEND_DOCKER_APPS}"

          if [ "${selected}" = "all" ]; then
            apps=("${all_apps[@]}")
          else
            apps=()
            for app in "${all_apps[@]}"; do
              if [ "${app}" = "${selected}" ]; then
                apps=("${app}")
                break
              fi
            done

            if [ "${#apps[@]}" -eq 0 ]; then
              echo "Unknown frontend app: ${selected}" >&2
              echo "Known apps: ${FRONTEND_DOCKER_APPS}" >&2
              exit 1
            fi
          fi

          echo "apps=${apps[*]}" >> "${GITHUB_OUTPUT}"
          echo "Selected apps: ${apps[*]}"

      - name: Bump selected app versions
        shell: bash
        run: |
          app_dir() {
            echo "apps/zhurong-platform-custom-$1"
          }

          bump_patch_version() {
            local version="$1"
            IFS='.' read -r major minor patch <<< "${version}"

            if [ -z "${major}" ] || [ -z "${minor}" ] || [ -z "${patch}" ]; then
              echo "Unsupported version format: ${version}" >&2
              exit 1
            fi

            echo "${major}.${minor}.$((patch + 1))"
          }

          bump_app() {
            local app_dir="$1"
            local package_json="${app_dir}/package.json"
            local current_version
            local next_version

            current_version="$(node -p "require('./${package_json}').version")"
            next_version="$(bump_patch_version "${current_version}")"

            pnpm exec npm pkg set version="${next_version}" --prefix "${app_dir}"
            echo "${app_dir}: ${current_version} -> ${next_version}"
          }

          for app in ${{ steps.frontend_apps.outputs.apps }}; do
            bump_app "$(app_dir "${app}")"
          done

      - name: Build frontend app
        shell: bash
        run: |
          app_dir() {
            echo "apps/zhurong-platform-custom-$1"
          }

          for app in ${{ steps.frontend_apps.outputs.apps }}; do
            package_name="$(node -p "require('./$(app_dir "${app}")/package.json').name")"
            pnpm exec turbo build --filter="${package_name}"
          done

      - name: Build Docker image
        shell: bash
        run: |
          app_dir() {
            echo "apps/zhurong-platform-custom-$1"
          }

          for app in ${{ steps.frontend_apps.outputs.apps }}; do
            pnpm --dir "$(app_dir "${app}")" run docker:build
          done

      - name: List built images
        run: docker images "zhurong-platform/*"

      - name: Login to Aliyun Container Registry
        run: echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login "${ALIYUN_REGISTRY}" --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" --password-stdin

      - name: Tag and push Aliyun images
        shell: bash
        run: |
          app_dir() {
            echo "apps/zhurong-platform-custom-$1"
          }

          get_app_version() {
            local app_dir="$1"
            node -p "require('./${app_dir}/package.json').version"
          }

          get_local_image() {
            local app_dir="$1"

            node - "${app_dir}" <<'NODE'
          const appDir = process.argv[2];
          const script = require(`./${appDir}/package.json`).scripts?.['docker:build'];
          const match = script?.match(/(?:^|\s)-t\s+([^\s]+)/);

          if (!match) {
            throw new Error(`${appDir}/package.json scripts.docker:build must include "-t <image>"`);
          }

          console.log(match[1].replace(/:latest$/, ''));
          NODE
          }

          publish_image() {
            local app_dir="$1"
            local local_image
            local remote_repo
            local version
            local remote_image

            local_image="$(get_local_image "${app_dir}")"
            remote_repo="${local_image//\//-}"
            version="$(get_app_version "${app_dir}")"
            remote_image="${ALIYUN_REGISTRY}/nbaliyun/${remote_repo}:${version}"

            echo "Publishing ${local_image}:latest to ${remote_image}"
            docker tag "${local_image}:latest" "${remote_image}"
            docker push "${remote_image}"
          }

          for app in ${{ steps.frontend_apps.outputs.apps }}; do
            publish_image "$(app_dir "${app}")"
          done

      - name: Commit bumped versions
        shell: bash
        run: |
          app_dir() {
            echo "apps/zhurong-platform-custom-$1"
          }

          package_jsons=()
          for app in ${{ steps.frontend_apps.outputs.apps }}; do
            package_jsons+=("$(app_dir "${app}")/package.json")
          done

          if git diff --quiet -- "${package_jsons[@]}"; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add "${package_jsons[@]}"
          git commit -m "Bump frontend Docker image versions"
          git push
